[project]
name = "collabio-backend"
version = "0.1.0"
description = "Collabio API: FastAPI service for the creator/brand marketplace"
requires-python = ">=3.12,<3.14"
dependencies = [
    "anthropic>=2.8.0",
    "asyncpg>=0.32.0",
    "elevenlabs>=2.71.0",
    "fastapi>=0.143.0",
    "google-genai>=2.29.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pgvector>=0.5.1",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.1",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "db: needs local Supabase",
    "live: calls real Gemini/ElevenLabs",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
